services:
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL (kafka:19092): para los contenedores de este compose
      # EXTERNAL (IP pública:9092): para los equipos fuera de Docker (los FO, los Monitores...)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # La IP pública se toma de la variable KAFKA_PUBLIC_IP (fichero .env en el servidor, sin subir a git).
      # Si no existe, se usa la de después de ":-". Si la IP de EC2 cambia, solo hay que editar el .env.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_PUBLIC_IP:-98.93.255.165}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Con un único broker estos valores deben ser 1 (por defecto son 3 y los grupos de consumidores fallan)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  central:
    restart: unless-stopped
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: wm_central/dockerfile
    ports:
      - "8080:8080"
    # La BD (SQLite) se crea en el directorio de trabajo. Lo movemos a /data, que es un volumen con nombre,
    # para que sobreviva a los despliegues. El código sigue en /app/wm_central (viene en la imagen).
    working_dir: /data
    entrypoint: ["python", "-u", "/app/wm_central/WM_Central.py"]
    command: ["8080", "kafka:19092"]
    volumes:
      - central_data:/data
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  central_data: