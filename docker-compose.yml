version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Cambia la IP de abajo por la IP pública de tu máquina EC2 en AWS
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://98.93.255.165:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

  central:
    stdin_open: true
    tty: true
    build: 
      context: .
      dockerfile: wm_central/dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./wm_central:/app/wm_central
    depends_on:
      - kafka
    command: ["8080", "kafka:9092"]